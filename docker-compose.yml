services:
  mysql:
    image: mysql:8.4
    container_name: slackbuddy-mysql
    environment:
      MYSQL_DATABASE: slackbuddy
      MYSQL_USER: slackbuddy
      MYSQL_PASSWORD: change_me
      MYSQL_ROOT_PASSWORD: root_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql
volumes:
  mysql_data:
