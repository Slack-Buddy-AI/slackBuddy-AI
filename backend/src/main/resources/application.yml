spring:
  application:
    name: slackbuddy-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/slackbuddy}
    username: ${DB_USERNAME:slackbuddy}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8080

slackbuddy:
  llm:
    provider: ${LLM_PROVIDER:ollama}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    app-token: ${SLACK_APP_TOKEN:}
